name: CI

on:
  push:
    branches: [main, dev, 'Feature*']
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  ASTRO_TELEMETRY_DISABLED: '1'

jobs:
  verify:
    name: Comprobar sitio
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Instalar dependencias locales
        run: npm ci
      - name: Comprobar tipos, pruebas, build, enlaces y presupuestos
        run: npm run verify
      - name: Preparar Chromium dentro de node_modules
        run: npm run test:e2e:install
      - name: Probar navegación, accesibilidad y estados interactivos
        run: npm run test:e2e
      - name: Guardar informe y capturas
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: browser-evidence
          path: |
            playwright-report/
            test-results/
          retention-days: 7
